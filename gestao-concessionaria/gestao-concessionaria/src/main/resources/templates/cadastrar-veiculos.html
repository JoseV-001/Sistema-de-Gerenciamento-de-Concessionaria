<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Cadastrar Veículo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #2c2f38; /* Cor de fundo escura */
            color: #e1e1e1; /* Cor de texto clara */
            border-top: 5px solid #ff9800; /* Detalhe em laranja */
            border-bottom: 5px solid #ff9800; /* Detalhe em laranja */
            height: 100vh; /* 100% da altura da página */
            display: flex;
            align-items: center; /* Centralizar verticalmente */
            justify-content: center; /* Centralizar horizontalmente */
            background-image: url('https://via.placeholder.com/1920x1080'); /* Imagem de fundo opcional */
            background-size: cover; /* Tamanho da imagem de fundo */
            background-position: center; /* Centraliza a imagem */
            background-attachment: fixed; /* Fixar imagem ao rolar */
        }
        .menu-container {
            position: relative;
            background-color: rgba(0, 0, 0, 0.7); /* Fundo escuro e translúcido */
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px); /* Desfoque do fundo */
            text-align: center;
            max-width: 900px;
            width: 100%;
        }
        h1 {
            color: #ff9800; /* Laranja para destacar título */
            margin-bottom: 30px;
            font-size: 2.5rem;
        }
        .form-label {
            color: #f8f9fa; /* Cor do texto dos rótulos */
        }
        .btn {
            background-color: #ff9800;
            color: #ffffff;
            border: none;
            padding: 10px 20px;
            font-size: 1rem;
            border-radius: 5px;
            cursor: pointer;
            text-transform: uppercase;
            transition: 0.3s;
            margin: 5px 0;
        }
        .btn:hover {
            background-color: #e6892e; /* Cor mais escura no hover */
        }
        table {
            width: 100%;
            margin-top: 30px;
        }
        table th, table td {
            text-align: center;
            padding: 10px;
        }
        table th {
            background-color: #ff9800;
            color: white;
        }
    </style>
</head>
<body>

    <div class="menu-container">
        <h1>Cadastrar Veículo</h1>

        <form id="vehicleForm">
            <div class="mb-3">
                <label class="form-label" for="marca">Marca</label>
                <input class="form-control" id="marca" name="marca" required type="text" placeholder="Ex: Ford">
            </div>
            <div class="mb-3">
                <label class="form-label" for="modelo">Modelo</label>
                <input class="form-control" id="modelo" name="modelo" required type="text" placeholder="Ex: Fusion">
            </div>
            <div class="mb-3">
                <label class="form-label" for="ano">Ano de Fabricação</label>
                <input class="form-control" id="ano" name="ano" required type="number" min="1900" max="2025" placeholder="Ex: 2020" oninput="validarAno()">
                <small id="anoHelp" class="form-text text-danger">Ano válido entre 1900 e 2025.</small>
            </div>
            <div class="mb-3">
                <label class="form-label" for="preco">Preço</label>
                <input class="form-control" id="preco" name="preco" required step="0.01" type="number" placeholder="Ex: 50000.00">
            </div>
            <button class="btn" type="submit">Cadastrar</button>
        </form>

        <a class="btn btn-secondary" href="/" style="display:block; margin-top: 15px;">Voltar</a>

        <!-- Tabela de veículos cadastrados -->
        <h2 class="mt-5 text-center">Veículos Cadastrados</h2>
        <table class="table table-striped">
            <thead>
                <tr>
                    <th>Marca</th>
                    <th>Modelo</th>
                    <th>Ano de Fabricação</th>
                    <th>Preço</th>
                </tr>
            </thead>
            <tbody id="vehicleTableBody">
                <!-- As informações serão inseridas aqui pelo JavaScript -->
            </tbody>
        </table>
    </div>

    <script>
        const form = document.getElementById('vehicleForm');
        const tableBody = document.getElementById('vehicleTableBody');

        let vehicles = [];

        form.addEventListener('submit', function(event) {
            event.preventDefault();

            const marca = document.getElementById('marca').value;
            const modelo = document.getElementById('modelo').value;
            const ano = document.getElementById('ano').value;
            const preco = document.getElementById('preco').value;

            const vehicle = { marca, modelo, ano, preco };
            vehicles.push(vehicle);

            renderTable();
            form.reset();
        });

        function renderTable() {
            tableBody.innerHTML = '';

            vehicles.forEach(vehicle => {
                const row = document.createElement('tr');

                Object.values(vehicle).forEach(value => {
                    const td = document.createElement('td');
                    td.textContent = value;
                    row.appendChild(td);
                });

                tableBody.appendChild(row);
            });
        }

        function validarAno() {
            const ano = document.getElementById('ano').value;
            const anoHelp = document.getElementById('anoHelp');
            if (ano < 1900 || ano > 2025) {
                anoHelp.style.display = 'block';
            } else {
                anoHelp.style.display = 'none';
            }
        }
    </script>

</body>
</html>
