<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Concessionária - Página Inicial</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #2c2f38; /* Cor de fundo escura */
            color: #e1e1e1; /* Cor de texto clara */
            border-top: 5px solid #ff9800; /* Detalhe em laranja */
            border-bottom: 5px solid #ff9800; /* Detalhe em laranja */
            height: 100vh; /* 100% da altura da página */
            display: flex;
            align-items: center; /* Centralizar verticalmente */
            justify-content: center; /* Centralizar horizontalmente */
            background-image: url('https://via.placeholder.com/1920x1080'); /* Imagem de fundo opcional */
            background-size: cover; /* Tamanho da imagem de fundo */
            background-position: center; /* Centraliza a imagem */
            background-attachment: fixed; /* Fixar imagem ao rolar */
        }
        .menu-container {
            position: relative;
            background-color: rgba(0, 0, 0, 0.6); /* Fundo escuro e translúcido */
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px); /* Desfoque do fundo */
            text-align: center;
        }
        h1 {
            color: #ff9800; /* Laranja para destacar título */
            margin-bottom: 30px;
            font-size: 2.5rem;
        }
        .btn {
            background-color: #ff9800;
            color: #ffffff;
            border: none;
            padding: 10px 20px;
            font-size: 1rem;
            border-radius: 5px;
            cursor: pointer;
            text-transform: uppercase;
            transition: 0.3s;
        }
        .btn:hover {
            background-color: #e6892e; /* Cor mais escura no hover */
        }
        footer {
            text-align: center;
            background-color: #2c2f38;
            padding: 15px 0;
            font-size: 14px;
            color: #e1e1e1;
            border-top: 2px solid #3a3f47;
            position: absolute;
            bottom: 0;
            width: 100%;
        }
        footer a {
            color: #ff9800; /* Link em laranja */
            text-decoration: none;
        }
        footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="menu-container">
        <h1>Bem-vindo à Concessionária-js</h1>
        <div class="d-grid gap-2 d-sm-flex justify-content-center">
            <a class="btn" href="/concessionaria/cadastrar-veiculos">Cadastrar Veículos</a>
            <a class="btn ms-sm-3" href="/concessionaria/cadastrar-clientes">Cadastrar Clientes</a>
        </div>
    </div>

    <footer>
        <p>Contato: <strong>(99) 1234-5678</strong> | Email: <a href="mailto:contato@concessionariapi.com">contato@concessionaria.com</a></p>
    </footer>
    
    <script>
        // Apenas para efeito visual de desfoque no fundo (se necessário ajustar mais)
        document.body.style.backgroundAttachment = 'fixed';
    </script>
</body>
</html>
