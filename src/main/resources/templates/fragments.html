<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
    <head>
    <th:block th:fragment="header(title)">
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title th:text="${title} + ' - Gestão de Concessionária'"></title>

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;700&display=swap" rel="stylesheet">

        <link rel="stylesheet" th:href="@{/css/style.css}">
    </th:block>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark" th:fragment="navbar">
        <div class="container-fluid">
            <a class="navbar-brand" th:href="@{/concessionaria/}">
                <i class="fas fa-car"></i> Gestão de Concessionária
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/concessionaria/cadastrar-veiculos}">Veículos</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/concessionaria/cadastrar-clientes}">Clientes</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/concessionaria/cadastrar-vendas}">Vendas</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <footer class="footer mt-auto py-3 text-center" th:fragment="footer">
        <div class="container">
            <span>&copy; 2025 Gestão de Concessionária. Todos os direitos reservados por José Victor | Contato por E-mail:victojose46@gmail.com</span>
        </div>
    </footer>

<th:block th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
</th:block>

</body>
</html>
