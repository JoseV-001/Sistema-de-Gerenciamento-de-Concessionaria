<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments :: header('Cadastro de Clientes')}"></th:block>
    <style>
        .invalid-feedback { display: none; width: 100%; margin-top: .25rem; font-size: .875em; color: #dc3545; }
        .is-invalid ~ .invalid-feedback { display: block; }
    </style>
</head>
<body>
<nav th:replace="~{fragments :: navbar}"></nav>
<main class="container container-80 my-4">
    <div class="row justify-content-center">
        <div class="col-12">
            <div class="card mb-4">
                <div class="card-header">Cadastrar Novo Cliente</div>
                <div class="card-body p-4">
                    <form id="clientForm" novalidate>
                        <div class="row">
                            <div class="col-md-6 mb-3"><label class="form-label" for="nome">Nome Completo</label><input class="form-control" id="nome" name="nome" placeholder="Ex: João Silva" required type="text"><div class="invalid-feedback" id="nome-error"></div></div>
                            <div class="col-md-6 mb-3"><label class="form-label" for="email">E-mail</label><input class="form-control" id="email" name="email" placeholder="Ex: joao@email.com" required type="email"><div class="invalid-feedback" id="email-error"></div></div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3"><label class="form-label" for="cpf">CPF</label><input class="form-control" id="cpf" name="cpf" oninput="formatarCPF(this)" placeholder="Ex: 123.456.789-00" required type="text"><div class="invalid-feedback" id="cpf-error"></div></div>
                            <div class="col-md-6 mb-3"><label class="form-label" for="telefone">Telefone</label><input class="form-control" id="telefone" name="telefone" oninput="formatarTelefone(this)" placeholder="Ex: (11) 99999-0000" required type="text"><div class="invalid-feedback" id="telefone-error"></div></div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3"><label class="form-label" for="cep">CEP</label><input class="form-control" id="cep" name="cep" oninput="formatarCEP(this)" placeholder="Ex: 12345-678" required type="text"><div class="invalid-feedback" id="cep-error"></div></div>
                            <div class="col-md-6 mb-3"><label class="form-label" for="endereco">Endereço</label><input class="form-control" id="endereco" name="endereco" placeholder="Ex: Rua das Flores, 123" required type="text"><div class="invalid-feedback" id="endereco-error"></div></div>
                        </div>
                        <button class="btn btn-primary" id="submitButton" type="submit">Cadastrar</button>
                    </form>
                </div>
            </div>
            <div class="card">
                <div class="card-header">Clientes Cadastrados</div>
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-striped table-hover">
                            <thead>
                                <tr>
                                    <th style="width: 5%;">ID</th>
                                    <th style="width: 15%;">Nome</th>
                                    <th style="width: 15%;">E-mail</th>
                                    <th style="width: 15%;">CPF</th>
                                    <th style="width: 10%;">Telefone</th>
                                    <th style="width: 10%;">CEP</th>
                                    <th style="width: 15%;">Endereço</th>
                                    <th style="width: 15%;">Ações</th>
                                </tr>
                            </thead>
                            <tbody id="clientTableBody"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>
<footer th:replace="~{fragments :: footer}"></footer>
<div id="confirmDeleteModal" style="display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background-color: #343a40; padding: 30px; border-radius: 10px; z-index: 1050; border: 1px solid var(--cor-borda);">
    <h4 class="text-center">Deseja realmente excluir este cliente?</h4>
    <div class="d-flex justify-content-center mt-4">
        <button class="btn btn-danger me-2" id="confirmDeleteBtn" onclick="confirmDelete()">Confirmar Exclusão</button>
        <button class="btn btn-secondary" onclick="cancelDelete()">Cancelar</button>
    </div>
</div>
<th:block th:replace="~{fragments :: scripts}"></th:block>

<script>
    // --- VARIÁVEIS GLOBAIS ---
    // Referências aos elementos principais do formulário e da tabela para fácil acesso.
    const form = document.getElementById('clientForm');
    const tableBody = document.getElementById('clientTableBody');
    // Variáveis para controlar o estado da edição e exclusão.
    let editingClientId = null;
    let deleteClientId = null;

    /**
     * Limpa todas as mensagens de erro e estilos de validação do formulário.
     * É chamada antes de cada nova submissão ou ao preencher o formulário para edição.
     */
    function clearErrors() {
        form.querySelectorAll('.invalid-feedback').forEach(div => div.textContent = '');
        form.querySelectorAll('.is-invalid').forEach(field => field.classList.remove('is-invalid'));
    }

    /**
     * Exibe as mensagens de erro de validação recebidas do backend.
     * @param {object} errors - Um objeto onde a chave é o nome do campo e o valor é a mensagem de erro.
     */
    function displayErrors(errors) {
        for (const field in errors) {
            const input = document.getElementById(field);
            const errorDiv = document.getElementById(`${field}-error`);
            if (input && errorDiv) {
                input.classList.add('is-invalid');
                errorDiv.textContent = errors[field];
            }
        }
    }

    /**
     * Evento principal que lida com a submissão do formulário (tanto para criar quanto para atualizar).
     */
    form.addEventListener('submit', function(event) {
        event.preventDefault(); // Impede o recarregamento padrão da página.
        clearErrors();

        // Monta o objeto 'client' com os dados dos campos do formulário.
        const client = {
            nome: document.getElementById('nome').value,
            email: document.getElementById('email').value,
            cpf: document.getElementById('cpf').value,
            telefone: document.getElementById('telefone').value,
            cep: document.getElementById('cep').value,
            endereco: document.getElementById('endereco').value,
        };
        // Define o método HTTP (POST para criar, PUT para atualizar) e o endpoint da API.
        const requestMethod = editingClientId ? 'PUT' : 'POST';
        const apiEndpoint = editingClientId ? `/api/clientes/${editingClientId}` : '/api/clientes';

        // Envia os dados para o backend.
        fetch(apiEndpoint, {
            method: requestMethod,
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(client)
        })
        .then(response => {
            if (response.ok) { // Verifica se a resposta foi um sucesso (status 2xx).
                return response.json();
            }
            // Se a resposta foi um erro (status 4xx), rejeita a promessa com os dados do erro.
            return response.json().then(errorData => Promise.reject(errorData));
        })
        .then(() => {
            // Bloco executado apenas em caso de SUCESSO.
            renderTable(); // Atualiza a tabela com os novos dados.
            form.reset();  // Limpa o formulário.
            editingClientId = null; // Reseta o estado de edição.
            document.getElementById('submitButton').textContent = 'Cadastrar';
        })
        .catch(errors => {
            // Bloco executado em caso de ERRO de rede ou de validação do backend.
            displayErrors(errors);
        });
    });

    /**
     * Busca a lista de clientes na API e renderiza a tabela na tela.
     */
    function renderTable() {
        fetch('/api/clientes', { cache: 'no-store' }) // 'no-store' para evitar cache.
            .then(response => response.json())
            .then(clients => {
                tableBody.innerHTML = ''; // Limpa a tabela antes de preencher.
                clients.forEach(client => {
                    const row = document.createElement('tr');
                    // Cria o conteúdo HTML da linha da tabela, agora incluindo o Endereço.
                    row.innerHTML = `
                        <td>${client.id}</td>
                        <td>${client.nome}</td>
                        <td>${client.email}</td>
                        <td>${client.cpf}</td>
                        <td>${client.telefone}</td>
                        <td>${client.cep}</td>
                        <td>${client.endereco}</td>
                    `;
                    // Cria a célula de ações (botões) separadamente.
                    const actionsTd = document.createElement('td');
                    actionsTd.innerHTML = `
                        <div class="action-buttons">
                            <button class="btn btn-primary btn-sm" onclick='preencherForm(${JSON.stringify(client)})'>Editar</button>
                            <button class="btn btn-danger btn-sm" onclick='deleteClient(${client.id})'>Deletar</button>
                        </div>
                    `;
                    row.appendChild(actionsTd);
                    tableBody.appendChild(row);
                });
            });
    }

    /**
     * Preenche o formulário com os dados de um cliente para edição.
     * @param {object} client - O objeto do cliente a ser editado.
     */
    function preencherForm(client) {
        clearErrors();
        document.getElementById('nome').value = client.nome;
        document.getElementById('email').value = client.email;
        document.getElementById('cpf').value = client.cpf;
        document.getElementById('telefone').value = client.telefone;
        document.getElementById('cep').value = client.cep;
        document.getElementById('endereco').value = client.endereco;
        editingClientId = client.id; // Define o ID para o modo de edição.
        document.getElementById('submitButton').textContent = 'Atualizar';
        window.scrollTo(0, 0); // Rola a página para o topo.
    }

    /**
     * Funções para controlar o modal de confirmação de exclusão.
     */
    function deleteClient(id) {
        deleteClientId = id;
        document.getElementById('confirmDeleteModal').style.display = 'block';
    }
    function confirmDelete() {
        fetch(`/api/clientes/${deleteClientId}`, { method: 'DELETE' })
        .then(() => {
            renderTable();
            cancelDelete();
        })
        .catch(error => console.error('Erro ao deletar:', error));
    }
    function cancelDelete() {
        deleteClientId = null;
        document.getElementById('confirmDeleteModal').style.display = 'none';
    }
    
    /**
     * Funções de máscara para os campos do formulário.
     */
    function formatarCPF(cpf) { cpf.value = cpf.value.replace(/\D/g, "").replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, "$1.$2.$3-$4"); }
    function formatarTelefone(telefone) { telefone.value = telefone.value.replace(/\D/g, "").replace(/^(\d{2})(\d)/, "($1) $2").replace(/(\d{5})(\d{4})$/, "$1-$2"); }
    function formatarCEP(cep) { cep.value = cep.value.replace(/\D/g, "").replace(/^(\d{5})(\d{3})$/, "$1-$2"); }

    /**
     * Garante que a função renderTable() seja chamada apenas após a página estar completamente carregada.
     */
    document.addEventListener('DOMContentLoaded', function() {
        renderTable();
    });
</script>

</body>
</html>
