<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
    <head>
    <th:block th:replace="~{fragments :: header('Página Inicial')}"></th:block>
</head>
<body>
    <nav th:replace="~{fragments :: navbar}"></nav>
    <main class="container container-80 my-4">
        <div class="d-flex align-items-center justify-content-center" style="height: 80vh;">
            <div class="text-center p-5 rounded-3" style="background-color: rgba(30, 30, 30, 0.85); backdrop-filter: blur(10px);">
                <h1 class="display-4" style="color: var(--cor-primaria);">Bem-vindo à Gestão da Concessionária</h1>
                <p class="lead" style="color: var(--cor-texto);">Selecione uma das opções abaixo para começar.</p>
                <hr class="my-4" style="border-color: var(--cor-borda);">
                <div class="d-grid gap-2 d-sm-flex justify-content-center">
                    <a class="btn btn-primary btn-lg" th:href="@{/concessionaria/cadastrar-veiculos}">Gerenciar Veículos</a>
                    <a class="btn btn-primary btn-lg ms-sm-3" th:href="@{/concessionaria/cadastrar-clientes}">Gerenciar Clientes</a>
                    <a class="btn btn-primary btn-lg ms-sm-3" th:href="@{/concessionaria/cadastrar-vendas}">Gerenciar Vendas</a>
                </div>
            </div>
        </div>
    </main>
    <footer th:replace="~{fragments :: footer}"></footer>
<th:block th:replace="~{fragments :: scripts}"></th:block>
</body>
</html>
