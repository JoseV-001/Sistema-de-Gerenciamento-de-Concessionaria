<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments :: header('Cadastro de Veículos')}"></th:block>
</head>
<body>
<nav th:replace="~{fragments :: navbar}"></nav>
<main class="container container-80 my-4">
    <div class="row justify-content-center">
        <div class="col-12">
            <div class="card mb-4">
                <div class="card-header">Cadastrar Novo Veículo</div>
                <div class="card-body p-4">
                    <form id="vehicleForm">
                        <div class="row">
                            <div class="col-md-6 mb-3"><label class="form-label" for="marca">Marca</label><input class="form-control" id="marca" name="marca" placeholder="Ex: Honda" required type="text"></div>
                            <div class="col-md-6 mb-3"><label class="form-label" for="modelo">Modelo</label><input class="form-control" id="modelo" name="modelo" placeholder="Ex: Civic" required type="text"></div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3"><label class="form-label" for="ano">Ano de Fabricação</label><input class="form-control" id="ano" name="ano" placeholder="Ex: 2025" required type="number"></div>
                            <div class="col-md-6 mb-3"><label class="form-label" for="preco">Preço (R$)</label><input class="form-control" id="preco" name="preco" placeholder="Ex: 85000.00" required step="0.01" type="number"></div>
                        </div>
                        <button class="btn btn-primary" id="submitButton" type="submit">Cadastrar</button>
                    </form>
                </div>
            </div>
            <div class="card">
                <div class="card-header">Veículos Disponíveis</div>
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-striped table-hover">
                            <thead>
                                <tr>
                                    <th style="width: 5%;">ID</th>
                                    <th style="width: 20%;">Marca</th>
                                    <th style="width: 25%;">Modelo</th>
                                    <th style="width: 10%;">Ano</th>
                                    <th style="width: 20%;">Preço</th>
                                    <th style="width: 20%;">Ações</th>
                                </tr>
                            </thead>
                            <tbody id="vehicleTableBody"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>
<footer th:replace="~{fragments :: footer}"></footer>
<th:block th:replace="~{fragments :: scripts}"></th:block>

<script>
    // --- VARIÁVEIS GLOBAIS ---
    // Referências aos elementos do formulário e da tabela.
    const form = document.getElementById('vehicleForm');
    const tableBody = document.getElementById('vehicleTableBody');
    // Variável para controlar se estamos em modo de edição e qual o ID do veículo.
    let editingVehicleId = null;

    /**
     * Evento principal que lida com a submissão do formulário (criar ou atualizar veículo).
     */
    form.addEventListener('submit', function(event) {
        event.preventDefault(); // Impede o recarregamento da página.

        // Monta o objeto 'vehicle' com os dados do formulário.
        const vehicle = {
            marca: document.getElementById('marca').value,
            modelo: document.getElementById('modelo').value,
            ano: document.getElementById('ano').value,
            preco: document.getElementById('preco').value,
            vendido: false, // Novos carros são sempre cadastrados como 'não vendidos'.
        };
        
        // Define o método HTTP e o endpoint da API com base no modo (criação ou edição).
        const requestMethod = editingVehicleId ? 'PUT' : 'POST';
        const apiEndpoint = editingVehicleId ? `/api/veiculos/${editingVehicleId}` : '/api/veiculos';

        // Envia os dados para o backend.
        fetch(apiEndpoint, {
            method: requestMethod,
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(vehicle)
        })
        .then(() => {
            // Em caso de sucesso, atualiza a tabela e reseta o formulário.
            renderTable();
            form.reset();
            editingVehicleId = null; // Sai do modo de edição.
            document.getElementById('submitButton').textContent = 'Cadastrar';
        })
        .catch(error => console.error('Erro:', error));
    });

    /**
     * Busca a lista de veículos na API e renderiza a tabela na tela.
     */
    function renderTable() {
        fetch('/api/veiculos', { cache: 'no-store' }) // Evita o cache para sempre ter a lista mais recente.
            .then(response => response.json())
            .then(vehicles => {
                tableBody.innerHTML = ''; // Limpa a tabela antes de preencher.
                vehicles.forEach(vehicle => {
                    // Adiciona o veículo na tabela apenas se ele não estiver marcado como vendido.
                    if (!vehicle.vendido) {
                        const row = document.createElement('tr');
                        row.innerHTML = `
                            <td>${vehicle.id}</td>
                            <td>${vehicle.marca}</td>
                            <td>${vehicle.modelo}</td>
                            <td>${vehicle.ano}</td>
                            <td>R$ ${parseFloat(vehicle.preco).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}</td>
                        `;
                        const actionsTd = document.createElement('td');
                        actionsTd.innerHTML = `
                            <div class="d-flex justify-content-center gap-2">
                                <button class="btn btn-primary btn-sm" onclick='preencherForm(${JSON.stringify(vehicle)})'>Editar</button>
                                <button class="btn btn-danger btn-sm" onclick='deleteVehicle(${vehicle.id})'>Deletar</button>
                            </div>
                        `;
                        row.appendChild(actionsTd);
                        tableBody.appendChild(row);
                    }
                });
            });
    }

    /**
     * Preenche o formulário com os dados de um veículo para edição.
     * @param {object} vehicle - O objeto do veículo a ser editado.
     */
    function preencherForm(vehicle) {
        document.getElementById('marca').value = vehicle.marca;
        document.getElementById('modelo').value = vehicle.modelo;
        document.getElementById('ano').value = vehicle.ano;
        document.getElementById('preco').value = vehicle.preco;
        editingVehicleId = vehicle.id; // Define o ID para entrar no modo de edição.
        document.getElementById('submitButton').textContent = 'Atualizar';
        window.scrollTo(0, 0); // Rola a página para o topo para facilitar a edição.
    }

    /**
     * Pede confirmação e envia a requisição para deletar um veículo pelo ID.
     * @param {number} id - O ID do veículo a ser deletado.
     */
    function deleteVehicle(id) {
        if (confirm('Tem certeza que deseja deletar este veículo?')) {
            fetch(`/api/veiculos/${id}`, { method: 'DELETE' })
            .then(() => renderTable()) // Após deletar, atualiza a tabela.
            .catch(error => console.error('Erro ao deletar:', error));
        }
    }

    /**
     * Garante que a função renderTable() seja chamada apenas após a página estar completamente carregada.
     */
    document.addEventListener('DOMContentLoaded', function() {
        renderTable();
    });
</script>

</body>
</html>
