# Nome da aplica\u00e7\u00e3o
spring.application.name=gestao-concessionaria
# Configura\u00e7\u00e3o da conex\u00e3o com o banco de dados MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/gestao_concessionaria
spring.datasource.username=root
spring.datasource.password=36814426J!
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# Configura\u00e7\u00e3o do JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
# Configura\u00e7\u00e3o do pool de conex\u00f5es Hikari (opcional para melhorar a performance)
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.validation-query=SELECT 1
spring.datasource.hikari.validation-timeout=3000
# Configura\u00e7\u00f5es de log para debug
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.boot=DEBUG
logging.level.org.hibernate=INFO
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML

